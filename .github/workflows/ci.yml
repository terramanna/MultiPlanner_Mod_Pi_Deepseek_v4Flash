name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate file size policy
        run: python scripts/check_file_size_policy.py --all

      - name: Complexity gate (ruff C901)
        run: |
          python -m pip install ruff
          python -m ruff check .

      - name: Run Python project checks
        if: ${{ hashFiles('pyproject.toml') != '' }}
        # Scoped to scripts/tests: these cover the tooling scripts (chiefly the
        # file-size policy). The per-app suites (apps/api) need their own heavy
        # dependency sets and are not collected here.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . --no-build-isolation
          python -m pip install pytest
          pytest -q scripts/tests

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        with:
          node-version: "20"

      - name: Complexity gate (eslint)
        # JS twin of the ruff C901 gate above: hard cyclomatic-complexity cap (10)
        # from apps/web/eslint.config.js. eslint is installed inline rather than
        # added as a project dependency, exactly like ruff is for Python.
        if: ${{ hashFiles('apps/web/eslint.config.js') != '' }}
        working-directory: apps/web
        run: npx --yes eslint@9 .

      - name: Run Node project checks
        # Runs the apps/web node test suite (tests/*.check.js). Gated on and run
        # from apps/web; node is already provisioned by the setup-node step above.
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        working-directory: apps/web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm test
          npm run build
