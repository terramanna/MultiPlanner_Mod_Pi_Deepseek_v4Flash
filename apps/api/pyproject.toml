[project]
name = "multiplanner-api"
version = "0.1.0"
description = "FastAPI backend for MultiPlanner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "numpy>=1.26,<3.0",
  "Pillow>=10.0,<12.0",
  "requests>=2.32,<3.0",
  "pyproj>=3.6,<4.0",
  "shapely>=2.0,<3.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["multiplanner_api", "multiplanner_shared"]
package-dir = {multiplanner_api = "src/multiplanner_api", multiplanner_shared = "../../src/multiplanner_shared"}
